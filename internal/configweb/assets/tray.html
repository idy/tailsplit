<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>TailSplit</title>
  <link rel="preload" href="/vendor/magpie/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/vendor/magpie/fonts/lato-regular-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/vendor/magpie/css/magpie.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/tray.css">
  <script src="/i18n.js" defer></script>
  <script src="/tray.js" defer></script>
</head>
<body>
  <!-- Phosphor Icons 2.1.1, regular, MIT. See THIRD_PARTY_NOTICES.md. -->
  <svg class="symbols" aria-hidden="true"><defs>
    <symbol id="i-open" viewBox="0 0 256 256"><path d="M224,104a8,8,0,0,1-16,0V51.31l-74.34,74.35a8,8,0,0,1-11.32-11.32L196.69,40H144a8,8,0,0,1,0-16h72a8,8,0,0,1,8,8ZM192,136a8,8,0,0,0-8,8v64H48V72h64a8,8,0,0,0,0-16H48A16,16,0,0,0,32,72V208a16,16,0,0,0,16,16H184a16,16,0,0,0,16-16V144A8,8,0,0,0,192,136Z"/></symbol>
  </defs></svg>
  <header class="popup-header">
    <h1>TailSplit</h1>
    <button class="icon-button mds-icon-button" data-open-panel aria-label="打开主界面" title="打开主界面"><svg class="icon mds-icon" aria-hidden="true"><use href="#i-open"/></svg></button>
  </header>
  <main class="popup-main">
    <div class="popup-connection">
      <div class="popup-state" role="status" aria-live="polite" aria-atomic="true">
        <div class="popup-status"><i id="status-dot" aria-hidden="true"></i><strong id="status">正在读取</strong></div>
        <p id="connection-detail">正在读取本机配置…</p>
      </div>
      <button id="connect" class="connection-switch mds-switch" role="switch" aria-checked="false" aria-label="连接 TailSplit" aria-describedby="connection-detail" disabled><span class="mds-switch-track" aria-hidden="true"></span></button>
      <button id="setup" class="button small mds-button mds-button--small" hidden>设置出口</button>
    </div>
    <div class="popup-details">
      <div class="popup-row"><span class="popup-label">模式</span><span id="routing-mode">—</span></div>
      <div class="popup-row popup-exit">
        <span class="popup-label" id="exit-label">默认出口</span>
        <span class="popup-exit-value" id="exit-name">—</span>
      </div>
    </div>
    <div class="popup-error" id="error" role="alert" hidden><p id="error-message"></p><button class="link-button mds-link-button" id="retry">重试</button></div>
    <p class="popup-preview" id="preview-note" hidden>预览 · 连接状态为模拟数据</p>
  </main>
  <footer class="popup-footer">
    <button class="popup-link" data-open-panel>打开主界面</button>
    <button class="popup-link" id="quit" disabled>退出</button>
  </footer>
</body>
</html>
