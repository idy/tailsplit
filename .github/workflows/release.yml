name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to build and publish
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.goos }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            arch: amd64
            python_arch: x64
          - runner: ubuntu-24.04-arm
            goos: linux
            arch: arm64
            python_arch: arm64
          - runner: macos-15
            goos: darwin
            arch: arm64
            python_arch: arm64
          - runner: macos-15-intel
            goos: darwin
            arch: amd64
            python_arch: x64
          - runner: windows-2025
            goos: windows
            arch: amd64
            python_arch: x64
          - runner: windows-11-arm
            goos: windows
            arch: arm64
            python_arch: arm64
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GOMAXPROCS: '2'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.2'
          architecture: ${{ matrix.python_arch }}
          cache-dependency-path: go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python_arch }}
      - name: Validate source, race tests and offline configuration
        if: matrix.goos != 'windows'
        run: |
          test -z "$(gofmt -l .)"
          make test check
          python3 -B -m unittest discover -s tests/installer
          python3 -B -m unittest discover -s tests/packaging
      - name: Validate native Windows CLI, private state and process locks
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOWORK: 'off'
          PYTHONUTF8: '1'
        run: |
          go test -mod=readonly -tags with_gvisor -timeout 5m . ./cmd/tailsplit ./internal/privatefs ./internal/domainrules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -mod=readonly -tags with_gvisor . ./cmd/tailsplit ./internal/privatefs ./internal/domainrules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tests/packaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare optional macOS signing inputs
        if: matrix.goos == 'darwin' && github.event.repository.name == 'tailsplit' && vars.TAILSPLIT_SIGNED_RELEASES == 'true'
        env:
          TAILSPLIT_DEVELOPER_ID_SOPS: ${{ secrets.TAILSPLIT_DEVELOPER_ID_SOPS }}
          TAILSPLIT_NOTARY_SOPS: ${{ secrets.TAILSPLIT_NOTARY_SOPS }}
        run: |
          brew install sops openssl@3
          printf '%s\n' "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          python3 -I -B packaging/ci-signing.py
      - name: Build release binaries, packages and license notices
        shell: bash
        env:
          GH_TOKEN: ${{ matrix.goos == 'windows' && github.token || '' }}
          TAILSPLIT_SIGNED_RELEASE: ${{ matrix.goos == 'darwin' && github.event.repository.name == 'tailsplit' && vars.TAILSPLIT_SIGNED_RELEASES == 'true' && '1' || '0' }}
          SOPS_AGE_KEY: ${{ matrix.goos == 'darwin' && github.event.repository.name == 'tailsplit' && vars.TAILSPLIT_SIGNED_RELEASES == 'true' && secrets.TAILSPLIT_RELEASE_AGE_KEY || '' }}
        run: python -I -B packaging/release.py build --os '${{ matrix.goos }}' --arch '${{ matrix.arch }}' --tag "$RELEASE_TAG"
      - name: Verify native Windows ZIP and offline commands
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: python -I -B tests/packaging/windows.py --arch '${{ matrix.arch }}' --directory bin/release/assets
      - name: Verify native Windows desktop, SYSTEM service and installation lifecycle
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
        run: python -I -B tests/packaging/windows_desktop.py --arch '${{ matrix.arch }}' --directory bin/release/assets
      - name: Preserve Windows desktop verification evidence
        if: always() && matrix.goos == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-evidence-${{ matrix.arch }}-${{ github.run_attempt }}
          path: bin/windows-desktop-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify native Windows DNS-only TUN lifecycle
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          TAILSPLIT_WINDOWS_TUN_TEST: '1'
        run: go test -mod=readonly -tags with_gvisor -run '^TestWindowsTUNDNSLifecycle$' -timeout 2m -v .
      - name: Verify native Debian package lifecycle
        if: matrix.goos == 'linux'
        run: sudo bash tests/packaging/install.sh 'bin/deb/${{ matrix.arch }}'
      - name: Preserve notarization diagnostics
        if: failure() && matrix.goos == 'darwin' && github.event.repository.name == 'tailsplit'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notary-${{ matrix.arch }}-${{ github.run_attempt }}
          path: bin/release/work/**/app/*notary*.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.arch }}
          path: bin/release/assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Verify and publish complete release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: bin/release/assets
          merge-multiple: true
      - name: Verify all architectures and publish without replacing assets
        run: python3 -I -B packaging/release.py publish --tag "$RELEASE_TAG"
