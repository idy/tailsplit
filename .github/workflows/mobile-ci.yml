name: Mobile CI

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml', '.github/workflows/mobile-release.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml', '.github/workflows/mobile-release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: mobile

jobs:
  dart:
    name: Flutter analysis and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Resolve Flutter packages
        run: flutter pub get --enforce-lockfile
      - name: Analyze Dart
        run: flutter analyze --no-pub
      - name: Run Flutter tests
        run: flutter test --no-pub
      - name: Test the beta VPN and storage identity
        run: flutter test --no-pub --dart-define=TAILSPLIT_IOS_CHANNEL=beta test/app_identifiers_test.dart
      - name: Validate organizational release guards
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Test native build input validation
        run: |
          python3 -I -B -m unittest discover -s vendor/sing_box_flutter/tests -p test_native_tools.py
          python3 -I -B -m unittest discover -s vendor/sing_box_flutter/tests -p test_restore_core_artifact.py

  android:
    name: Android debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SINGBOX_PYTHON: python3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Prepare Android SDK and both native toolchains
        run: |
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # yes exits with SIGPIPE after sdkmanager has consumed the licenses.
          set +o pipefail
          yes | "$sdk_manager" --licenses >/dev/null
          set -o pipefail
          "$sdk_manager" \
            'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' \
            'ndk;28.0.13004108' 'ndk;28.2.13676358'
      - name: Resolve Flutter packages
        run: flutter pub get --enforce-lockfile
      - name: Build the selected Android core
        run: >-
          dart run sing_box_flutter build --target android
          --work-dir "$RUNNER_TEMP/sing-box-flutter-work"
      - name: Build debug APK
        run: flutter build apk --debug --no-pub
      - name: Test Android network handover and startup cancellation
        env:
          SINGBOX_REQUIRE_ANDROID_RUNTIME_TESTS: '1'
        run: python3 -I vendor/sing_box_flutter/tests/test_android_network_monitor.py

  apple:
    name: iOS simulator and both unsigned release channels
    runs-on: macos-26
    timeout-minutes: 120
    env:
      LANG: en_US.UTF-8
      SINGBOX_PYTHON: python3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Check Xcode SDKs and install CocoaPods
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          gem install --user-install cocoapods -v 1.17.0 --no-document
          ruby -r rubygems -e 'puts File.join(Gem.user_dir, "bin")' >> "$GITHUB_PATH"
      - name: Resolve Flutter packages
        run: flutter pub get --enforce-lockfile
      - name: Test native iOS command cancellation and tunnel runtime
        run: |
          python3 -I vendor/sing_box_flutter/tests/test_ios_cancellation.py
          python3 -I vendor/sing_box_flutter/tests/test_packet_tunnel_runtime.py
          bash vendor/sing_box_flutter/ios/Tests/run-native-smoke.sh
      - name: Build the selected Apple core
        run: >-
          dart run sing_box_flutter build --target apple
          --work-dir "$RUNNER_TEMP/sing-box-flutter-work"
      - name: Install iOS pods for the selected core
        run: |
          flutter precache --ios
          pod install --project-directory=ios
      - name: Build simulator app
        run: flutter build ios --simulator --debug --no-codesign --no-pub
      - name: Build both unsigned device release channels
        run: |
          for channel in beta app-store; do
            bash tool/build_ios_release.sh "$channel"
          done
