name: iOS release (Termitoc)
run-name: iOS ${{ inputs.channel }} → ${{ inputs.destination }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: App identity (beta is TestFlight-only; app-store also supports public App Review)
        type: choice
        options: [beta, app-store]
        default: beta
      destination:
        description: Sign only, upload to internal TestFlight, or upload and submit to App Store review
        type: choice
        options: [artifact, testflight, app-store]
        default: testflight
      archive_run_id:
        description: Optional completed main-branch release run whose unsigned archive should be signed and delivered again
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: tailsplit-ios-release-${{ inputs.channel }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build unsigned iOS archive (${{ inputs.channel }}, no release credentials)
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && github.ref_protected
      && inputs.archive_run_id == ''
    runs-on: macos-26
    timeout-minutes: 150
    # No protected environment, signing tools, or secrets on this runner.
    defaults:
      run:
        working-directory: mobile
    env:
      LANG: en_US.UTF-8
      SINGBOX_PYTHON: python3
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_DESTINATION: ${{ inputs.destination }}
    outputs:
      archive-id: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - name: Validate release selection
        working-directory: ${{ runner.temp }}
        run: |
          case "$RELEASE_CHANNEL/$RELEASE_DESTINATION" in
            beta/artifact|beta/testflight|app-store/artifact|app-store/testflight|app-store/app-store) ;;
            *) printf 'Invalid release selection: beta is TestFlight-only.\n' >&2; exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Install CocoaPods
        run: |
          gem install --user-install cocoapods -v 1.17.0 --no-document
          ruby -r rubygems -e 'puts File.join(Gem.user_dir, "bin")' >> "$GITHUB_PATH"
      - name: Resolve packages and validate
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub
          flutter test --no-pub --dart-define=TAILSPLIT_IOS_CHANNEL=beta test/app_identifiers_test.dart
          python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Build the selected Apple core
        run: >-
          dart run sing_box_flutter build --target apple --apple-platform ios
          --work-dir "$RUNNER_TEMP/sing-box-flutter-work"
      - name: Install iOS pods
        run: |
          flutter precache --ios
          pod install --project-directory=ios
      - name: Build and package an unsigned archive
        run: |
          bash tool/build_ios_release.sh "$RELEASE_CHANNEL" --build-number="$GITHUB_RUN_NUMBER"
          /usr/bin/ditto -c -k --norsrc --noextattr --noqtn --keepParent \
            build/ios/archive/Runner.xcarchive "$RUNNER_TEMP/unsigned.xcarchive.zip"
      - name: Transfer only the unsigned archive
        id: archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tailsplit-ios-unsigned-${{ inputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unsigned.xcarchive.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  sign:
    name: Sign and deliver ${{ inputs.channel }} with TERMITOC PTE. LTD.
    needs: build
    # A new GitHub-hosted VM is the security boundary. Never combine these jobs
    # or use a persistent/self-hosted runner for credentialed signing.
    if: >-
      always()
      && github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && github.ref_protected
      && (needs.build.result == 'success'
          || (inputs.archive_run_id != '' && needs.build.result == 'skipped'))
    runs-on: macos-26
    timeout-minutes: 90
    environment: mobile-release
    permissions:
      contents: read
      actions: read
    env:
      LANG: en_US.UTF-8
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_DESTINATION: ${{ inputs.destination }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /mobile/tool/release_ios.py
            /mobile/tool/publish_testflight.py
            /mobile/release-identity.json
            /mobile/credentials/apple-distribution.json.sops
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned signing tools in a fresh environment
        working-directory: ${{ runner.temp }}
        run: |
          python3 -I -m venv "$RUNNER_TEMP/signing-tools"
          "$RUNNER_TEMP/signing-tools/bin/python3" -I -m pip install --no-cache-dir 'codemagic-cli-tools==0.70.2'
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.darwin.arm64 \
            --output "$RUNNER_TEMP/signing-tools/bin/sops"
          printf '%s  %s\n' b97c0d434aab577dc40310e8d22ff9e45eef4c80638ab978daae9b4681c59286 \
            "$RUNNER_TEMP/signing-tools/bin/sops" | shasum -a 256 --check
          chmod 700 "$RUNNER_TEMP/signing-tools/bin/sops"
      - name: Resolve and download a trusted unsigned archive without extracting it
        id: archive_input
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.archive-id }}
          EXPECTED_NAME: tailsplit-ios-unsigned-${{ inputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$RELEASE_CHANNEL/$RELEASE_DESTINATION" in
            beta/artifact|beta/testflight|app-store/artifact|app-store/testflight|app-store/app-store) ;;
            *) printf 'Invalid release selection.\n' >&2; exit 1 ;;
          esac
          SOURCE_RUN_ID="$GITHUB_RUN_ID"
          SOURCE_SHA="$GITHUB_SHA"
          BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          if [[ -n "$ARCHIVE_RUN_ID" ]]; then
            [[ "$ARCHIVE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARCHIVE_RUN_ID" > "$RUNNER_TEMP/source-release.json"
            jq -e --arg branch "$DEFAULT_BRANCH" --arg repo "$GITHUB_REPOSITORY" \
              '.event == "workflow_dispatch" and .status == "completed" and .head_branch == $branch and .head_repository.full_name == $repo and .path == ".github/workflows/mobile-release.yml"' \
              "$RUNNER_TEMP/source-release.json" > /dev/null
            SOURCE_RUN_ID="$ARCHIVE_RUN_ID"
            SOURCE_SHA="$(jq -r .head_sha "$RUNNER_TEMP/source-release.json")"
            BUILD_NUMBER="$(jq -r .run_number "$RUNNER_TEMP/source-release.json")"
            [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
            # Reuse only source commits already contained in the protected release revision.
            gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_SHA...$GITHUB_SHA" |
              jq -e --arg sha "$SOURCE_SHA" '(.status == "ahead" or .status == "identical") and .merge_base_commit.sha == $sha' > /dev/null
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?filter=all&per_page=100" |
              jq -e --arg name "Build unsigned iOS archive ($RELEASE_CHANNEL, no release credentials)" \
                'any(.[].jobs[]; .name == $name and .conclusion == "success")' > /dev/null
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" |
              jq -e --arg pattern "^tailsplit-ios-unsigned-$RELEASE_CHANNEL-$SOURCE_RUN_ID-[1-9][0-9]*$" \
                '[.artifacts[] | select(.expired == false and (.name | test($pattern)))] | sort_by(.created_at) | last // error("No matching unsigned archive")' \
                > "$RUNNER_TEMP/source-artifact.json"
            ARTIFACT_ID="$(jq -r .id "$RUNNER_TEMP/source-artifact.json")"
            EXPECTED_NAME="$(jq -r .name "$RUNNER_TEMP/source-artifact.json")"
          fi
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" |
            jq -e --arg run "$SOURCE_RUN_ID" --arg sha "$SOURCE_SHA" --arg name "$EXPECTED_NAME" \
              '(.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $sha and .name == $name and .expired == false' > /dev/null
          # Keep both ZIP layers opaque until the release helper validates every member.
          mkdir -m 700 "$RUNNER_TEMP/release-input"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/release-input/unsigned-artifact.zip"
          printf 'build-number=%s\n' "$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Export, verify organization and channel, and deliver
        working-directory: ${{ runner.temp }}
        env:
          TAILSPLIT_MOBILE_RELEASE_AGE_KEY: ${{ secrets.TAILSPLIT_MOBILE_RELEASE_AGE_KEY }}
          ARCHIVE_BUILD_NUMBER: ${{ steps.archive_input.outputs.build-number }}
        run: |
          args=(--channel "$RELEASE_CHANNEL" --build-number "$ARCHIVE_BUILD_NUMBER")
          case "$RELEASE_DESTINATION" in
            artifact) ;;
            testflight) args+=(--publish) ;;
            app-store) args+=(--publish --submit-for-review) ;;
            *) printf 'Unknown release destination.\n' >&2; exit 1 ;;
          esac
          "$RUNNER_TEMP/signing-tools/bin/python3" -I -B "$GITHUB_WORKSPACE/mobile/tool/release_ios.py" \
            --artifact "$RUNNER_TEMP/release-input/unsigned-artifact.zip" --output "$RUNNER_TEMP/verified-ipa" "${args[@]}"
      - name: Retain the verified organization-signed IPA and TestFlight receipt
        # The helper copies only a verified IPA here, even if upload/review later fails.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tailsplit-ios-${{ inputs.channel }}-termitoc-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/verified-ipa/*.ipa
            ${{ runner.temp }}/verified-ipa/testflight.json
          if-no-files-found: ignore
          retention-days: 7
