name: iOS release (Termitoc)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the signed IPA to Termitoc App Store Connect / internal TestFlight
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tailsplit-ios-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build unsigned iOS archive (no release credentials)
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && github.ref_protected
    runs-on: macos-26
    timeout-minutes: 150
    # No protected environment, signing tools, or secrets on this runner.
    defaults:
      run:
        working-directory: mobile
    env:
      LANG: en_US.UTF-8
      SINGBOX_PYTHON: python3
    outputs:
      archive-id: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Install CocoaPods
        run: |
          gem install --user-install cocoapods -v 1.17.0 --no-document
          ruby -r rubygems -e 'puts File.join(Gem.user_dir, "bin")' >> "$GITHUB_PATH"
      - name: Resolve packages and validate
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub
          python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Build the selected Apple core
        run: >-
          dart run sing_box_flutter build --target apple --apple-platform ios
          --work-dir "$RUNNER_TEMP/sing-box-flutter-work"
      - name: Install iOS pods
        run: |
          flutter precache --ios
          pod install --project-directory=ios
      - name: Build and package an unsigned archive
        run: |
          flutter build ipa --release --no-codesign --no-pub --build-number="$GITHUB_RUN_NUMBER"
          /usr/bin/ditto -c -k --norsrc --noextattr --noqtn --keepParent \
            build/ios/archive/Runner.xcarchive "$RUNNER_TEMP/unsigned.xcarchive.zip"
      - name: Transfer only the unsigned archive
        id: archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tailsplit-ios-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unsigned.xcarchive.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  sign:
    name: Sign iOS with TERMITOC PTE. LTD.
    needs: build
    # A new GitHub-hosted VM is the security boundary. Never combine these jobs
    # or use a persistent/self-hosted runner for credentialed signing.
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && github.ref_protected
    runs-on: macos-26
    timeout-minutes: 45
    environment: mobile-release
    permissions:
      contents: read
      actions: read
    env:
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /mobile/tool/release_ios.py
            /mobile/release-identity.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned signing tools in a fresh environment
        working-directory: ${{ runner.temp }}
        run: |
          python3 -I -m venv "$RUNNER_TEMP/signing-tools"
          "$RUNNER_TEMP/signing-tools/bin/python3" -I -m pip install --no-cache-dir 'codemagic-cli-tools==0.70.2'
      - name: Download this run's archive without extracting it
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.archive-id }}
          EXPECTED_NAME: tailsplit-ios-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" |
            jq -e --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --arg name "$EXPECTED_NAME" \
              '(.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $sha and .name == $name and .expired == false' > /dev/null
          # Keep the outer Actions ZIP opaque too: release_ios validates both ZIPs
          # before extraction, instead of letting an artifact overwrite runner files.
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/unsigned-artifact.zip"
      - name: Export, verify organization, and optionally publish
        working-directory: ${{ runner.temp }}
        env:
          BGL4WMWD3W_APPLE_CREDENTIALS: ${{ secrets.BGL4WMWD3W_APPLE_CREDENTIALS }}
          PUBLISH_IOS: ${{ inputs.publish }}
        run: |
          args=()
          if [[ "$PUBLISH_IOS" == true ]]; then args+=(--publish); fi
          "$RUNNER_TEMP/signing-tools/bin/python3" -I -B "$GITHUB_WORKSPACE/mobile/tool/release_ios.py" \
            --artifact "$RUNNER_TEMP/unsigned-artifact.zip" --output "$RUNNER_TEMP/verified-ipa" "${args[@]}"
      - name: Retain the verified organization-signed IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tailsplit-ios-termitoc-${{ github.run_number }}
          path: ${{ runner.temp }}/verified-ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
