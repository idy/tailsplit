name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '.github/workflows/pages.yml']
  # Required checks must also run for website-only pull requests.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.2'
          cache-dependency-path: go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Formatting and installer syntax
        run: |
          test -z "$(gofmt -l .)"
          sh -n install.sh
      - name: Race tests, vet and configuration check
        run: make test check
      - name: Installer execution tests
        run: python3 -B -m unittest discover -s tests/installer
      - name: Release and packaging tests
        if: hashFiles('tests/packaging/test_*.py') != ''
        run: python3 -B -m unittest discover -s tests/packaging
      - name: Isolated TUN DNS coexistence
        if: runner.os == 'Linux' && hashFiles('scripts/test-tun-dns.sh') != ''
        run: sh scripts/test-tun-dns.sh

  windows:
    name: Windows desktop (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: amd64
            python_arch: x64
          - runner: windows-11-arm
            arch: arm64
            python_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      GOMAXPROCS: '2'
      GOWORK: 'off'
      CGO_ENABLED: '0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.2'
          architecture: ${{ matrix.python_arch }}
          cache-dependency-path: go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python_arch }}
      - name: Native CLI, state ACL and process-lock tests
        shell: pwsh
        run: |
          go test -mod=readonly -tags with_gvisor -timeout 5m . ./cmd/tailsplit ./internal/privatefs ./internal/domainrules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -mod=readonly -tags with_gvisor . ./cmd/tailsplit ./internal/privatefs ./internal/domainrules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tests/packaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows DNS-only TUN lifecycle
        shell: pwsh
        env:
          TAILSPLIT_WINDOWS_TUN_TEST: '1'
        run: go test -mod=readonly -tags with_gvisor -run '^TestWindowsTUNDNSLifecycle$' -timeout 2m -v .
      - name: Validate desktop capability, pipe identity, updater and native Go UI entry point
        shell: pwsh
        run: |
          go test -mod=readonly -tags with_gvisor -run '^(TestDesktop|TestWindows)' -timeout 3m ./internal/appservice ./internal/configweb ./internal/tray ./internal/winui ./cmd/tailsplit-tray
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -mod=readonly -tags with_gvisor -timeout 3m ./internal/appupdate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -mod=readonly -tags with_gvisor ./internal/appservice ./internal/configweb ./internal/tray ./internal/winui ./internal/appupdate ./cmd/tailsplit-tray
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native Windows archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I -B packaging/release.py build --os windows --arch '${{ matrix.arch }}' --directory bin/ci-windows/assets
      - name: Execute native Windows archive
        shell: pwsh
        run: python -I -B tests/packaging/windows.py --arch '${{ matrix.arch }}' --directory bin/ci-windows/assets
      - name: Verify native desktop window, SYSTEM service and installer lifecycle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I -B tests/packaging/windows_desktop.py --arch '${{ matrix.arch }}' --directory bin/ci-windows/assets
      - name: Preserve native desktop verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-evidence-${{ matrix.arch }}-${{ github.run_attempt }}
          path: bin/windows-desktop-evidence/
          if-no-files-found: ignore
          retention-days: 14
