name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '.github/workflows/pages.yml']
  pull_request:
    paths-ignore: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.2'
          cache-dependency-path: go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Formatting and installer syntax
        run: |
          test -z "$(gofmt -l .)"
          sh -n install.sh
      - name: Race tests, vet and offline configuration check
        run: make test check
      - name: Installer execution tests
        run: python3 -B -m unittest discover -s tests/installer
      - name: Release and packaging tests
        if: hashFiles('tests/packaging/test_*.py') != ''
        run: python3 -B -m unittest discover -s tests/packaging
      - name: Isolated TUN DNS coexistence
        if: runner.os == 'Linux' && hashFiles('scripts/test-tun-dns.sh') != ''
        run: sh scripts/test-tun-dns.sh
