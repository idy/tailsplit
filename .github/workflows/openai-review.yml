name: OpenAI PR review

on:
  # Internal updates must run on an event accepted by required-check rules.
  push:
    branches-ignore: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issue_comment:
    types: [created]
  issues:
    types: [edited, reopened, typed, untyped]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open internal pull request to review.
        required: true
        type: string

permissions:
  actions: write
  checks: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: openai-pr-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request_number || github.ref_name }}
  # Retain every pending approval; cancel-in-progress: false alone still drops
  # the older pending worker in GitHub's default single-slot queue.
  queue: max
  cancel-in-progress: false

jobs:
  resolve_review_target:
    if: >-
      github.event_name == 'push'
      || github.event_name == 'pull_request_target'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.target.outputs.number }}
    steps:
      - id: target
        env:
          CODEX_REVIEW_PR_INPUT: ${{ inputs.pull_request_number }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const event = context.eventName;
            let number;
            if (event === 'push') {
              const repository = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
              const base = context.payload.repository?.default_branch;
              if (!base) throw new Error('Could not establish the default branch');
              const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                ...context.repo, commit_sha: context.sha, per_page: 100,
              });
              const candidates = pulls.filter((pr) => pr.state === 'open' && !pr.draft
                && pr.head.sha === context.sha && pr.base.ref === base
                && pr.head.repo?.full_name?.toLowerCase() === repository
                && pr.base.repo?.full_name?.toLowerCase() === repository);
              if (!candidates.length) {
                core.info('No current open pull request for this pushed head.');
                core.setOutput('number', '');
                return;
              }
              if (candidates.length !== 1) throw new Error('Ambiguous pushed pull request');
              number = candidates[0].number;
            } else if (event === 'pull_request_target') {
              number = context.payload.pull_request?.number;
            } else if (event === 'issue_comment' && context.payload.issue?.pull_request) {
              // The shared reviewer still validates the actual comment request.
              number = context.payload.issue.number;
            } else if (event === 'workflow_dispatch') {
              number = Number(process.env.CODEX_REVIEW_PR_INPUT);
            } else {
              throw new Error('Unsupported review event');
            }
            if (!Number.isSafeInteger(number) || number < 1) {
              throw new Error('A positive safe integer pull request number is required');
            }
            core.setOutput('number', String(number));

  review:
    needs: resolve_review_target
    # Push handles internal main-target updates; target events cover forks and
    # PR lifecycle/metadata changes without executing any proposed project code.
    if: >-
      needs.resolve_review_target.outputs.number != ''
      && !(github.event_name == 'pull_request_target'
        && github.event.action == 'synchronize'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.base.ref == github.event.repository.default_branch)
    concurrency:
      group: openai-pr-review-invoke-${{ needs.resolve_review_target.outputs.number }}
      queue: max
      cancel-in-progress: false
    uses: GizClaw/github-workflows/.github/workflows/codex-openai-review.yml@latest
    with:
      review-instructions: >-
        Review the complete pull-request diff against the trusted base for
        actionable correctness, security, lifecycle, compatibility, and
        test-coverage findings on Linux, macOS, and Windows. Check that TUN and
        system DNS changes are restored on every exit path, that traffic never
        silently falls back to an unintended route, and that installers and
        desktop updates keep their checksum and signature verification. Treat
        credentials, signing inputs, and generated artifacts as sensitive
        repository boundaries.
      issue-review-instructions: >-
        Require each linked implementation Issue to define its background,
        goal and non-goals, planned file ownership, design, and observable
        validation without exposing credentials.
      pr-readiness-instructions: >-
        Require valid PR metadata, a description of the delivered behavior,
        current validation evidence, and no actionable findings. Closing
        Issues are optional; check Issue linkage and plan conformance when
        present.
      # Do not bypass the shared issue-comment request/approval validator.
      pull_request_number: ${{ github.event_name == 'push' && needs.resolve_review_target.outputs.number || inputs.pull_request_number }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  resolve_linked_prs:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    outputs:
      pull_requests: ${{ steps.links.outputs.pull_requests }}
      pull_request_count: ${{ steps.links.outputs.pull_request_count }}
    steps:
      - id: links
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const data = await github.graphql(`
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    closedByPullRequestsReferences(first: 50) {
                      totalCount
                      nodes { number state repository { nameWithOwner } }
                    }
                  }
                }
              }
            `, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: Number(context.payload.issue.number),
            });
            const references = data.repository.issue
              ?.closedByPullRequestsReferences;
            if (!references) {
              throw new Error('Issue was not found');
            }
            if (references.totalCount > references.nodes.length) {
              throw new Error(
                'Could not resolve every linked pull request within the configured bound',
              );
            }
            if (references.nodes.some((pullRequest) =>
              typeof pullRequest?.repository?.nameWithOwner !== 'string')) {
              throw new Error('Could not establish a linked pull request repository');
            }
            const repository = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            const pullRequests = references.nodes
              .filter((pullRequest) => pullRequest.state === 'OPEN'
                && pullRequest.repository.nameWithOwner.toLowerCase() === repository)
              .map((pullRequest) => pullRequest.number);
            core.setOutput('pull_requests', JSON.stringify(pullRequests));
            core.setOutput('pull_request_count', String(pullRequests.length));

  refresh_linked_prs:
    needs: resolve_linked_prs
    if: >-
      needs.resolve_linked_prs.result == 'success'
      && needs.resolve_linked_prs.outputs.pull_request_count != '0'
    strategy:
      fail-fast: false
      matrix:
        pull_request_number: ${{ fromJSON(needs.resolve_linked_prs.outputs.pull_requests) }}
    concurrency:
      group: openai-pr-review-invoke-${{ matrix.pull_request_number }}
      queue: max
      cancel-in-progress: false
    uses: GizClaw/github-workflows/.github/workflows/codex-openai-review.yml@latest
    with:
      review-instructions: >-
        Review the complete pull-request diff against the trusted base for
        actionable correctness, security, lifecycle, compatibility, and
        test-coverage findings on Linux, macOS, and Windows. Check that TUN and
        system DNS changes are restored on every exit path, that traffic never
        silently falls back to an unintended route, and that installers and
        desktop updates keep their checksum and signature verification. Treat
        credentials, signing inputs, and generated artifacts as sensitive
        repository boundaries.
      issue-review-instructions: >-
        Require each linked implementation Issue to define its background,
        goal and non-goals, planned file ownership, design, and observable
        validation without exposing credentials.
      pr-readiness-instructions: >-
        Require valid PR metadata, a description of the delivered behavior,
        current validation evidence, and no actionable findings. Closing
        Issues are optional; check Issue linkage and plan conformance when
        present.
      pull_request_number: ${{ matrix.pull_request_number }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
