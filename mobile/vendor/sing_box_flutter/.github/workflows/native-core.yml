name: Native core

on:
  # Always publish Native CI gate, including for documentation-only PRs.
  # The changes job keeps expensive native builds conditional on their inputs.
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Native build target
        required: true
        default: all
        type: choice
        options: [all, android, apple]
      profile:
        description: Example selectable core profile
        required: true
        default: wgc-minimal
        type: choice
        options: [wgc-minimal, wgc-tailscale, singbox-full]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.inputs.outputs.native }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Identify native build inputs
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I - <<'PY'
          import os
          import re
          import subprocess
          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              required = True
          else:
              revisions = [os.environ['BASE_SHA'], os.environ['HEAD_SHA']]
              if any(re.fullmatch(r'[0-9a-f]{40}', sha) is None for sha in revisions):
                  raise SystemExit('Missing pull request comparison revisions')
              # Do not hide the native side of renames into another directory.
              changed = subprocess.check_output(['git', 'diff', '--no-renames', '--name-only', '-z', *revisions, '--'])
              prefixes = (b'native/', b'ios/', b'android/', b'bin/', b'lib/', b'example/', b'tool/', b'tests/')
              files = {b'native-core.json', b'pubspec.yaml', b'THIRD_PARTY_NOTICES.md', b'LICENSE',
                       b'.github/workflows/native-core.yml', b'.github/scripts/publish_native_release.py'}
              required = any(path.startswith(prefixes) or path in files for path in changed.split(b'\0') if path)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('native=' + str(required).lower() + '\n')
          PY

  validate:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Test pins, safe extraction and toolchain selection
        run: python3 -B -m unittest discover -s tests -v
      - name: Inspect build and install plans
        run: |
          python3 -B tool/build_libbox.py --target all --dry-run
          python3 -B tool/install_libbox.py --target all --release v0.2.0 --dry-run

  build:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            runner: ubuntu-24.04
          - target: apple
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      PUB_CACHE: ${{ github.workspace }}/.build/pub-cache
    steps:
      - name: Select requested platform
        id: select
        shell: bash
        run: |
          if [ '${{ github.event_name }}' = 'pull_request' ] || [ '${{ inputs.target }}' = 'all' ] || [ '${{ inputs.target }}' = '${{ matrix.target }}' ]; then
            printf 'enabled=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'enabled=false\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.select.outputs.enabled == 'true'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.select.outputs.enabled == 'true'
        with:
          python-version: '3.13'
      - name: Prepare project-local Android SDK
        if: steps.select.outputs.enabled == 'true' && matrix.target == 'android'
        shell: bash
        run: |
          set -eu
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          native_sdk="$GITHUB_WORKSPACE/.build/android-sdk"
          mkdir -p "$native_sdk"
          # Use the runner's JDK 17; no stock Go or Go setup action is involved.
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          # sdkmanager/yes closes the pipe normally after reading the licenses.
          set +o pipefail
          yes | "$sdk_manager" --sdk_root="$native_sdk" --licenses >/dev/null
          set -o pipefail
          "$sdk_manager" --sdk_root="$native_sdk" \
            'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' \
            'ndk;28.0.13004108' 'ndk;28.2.13676358' \
            'cmdline-tools;latest' 'emulator' 'system-images;android-35;default;x86_64'
          printf 'JAVA_HOME=%s\nANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' \
            "$JAVA_HOME" "$native_sdk" "$native_sdk" >> "$GITHUB_ENV"
      - name: Build pinned core with Tailscale Go
        if: steps.select.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/logs
          python3 -B tool/build_libbox.py --target '${{ matrix.target }}' \
            2>&1 | tee '.build/logs/${{ matrix.target }}.log'
      - name: Check representative selectable core registries
        if: steps.select.outputs.enabled == 'true'
        run: python3 -B tool/check_core_profiles.py --target '${{ matrix.target }}' --race
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        if: steps.select.outputs.enabled == 'true'
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Resolve Flutter packages for selectable core CLI
        if: steps.select.outputs.enabled == 'true'
        run: flutter pub get
      - name: Build the example's selected core
        if: steps.select.outputs.enabled == 'true'
        working-directory: example
        shell: bash
        env:
          CORE_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'wgc-minimal' }}
        run: |
          set -euo pipefail
          flutter pub get
          dart run tool/select_core_profile.dart "$CORE_PROFILE"
          flutter test
          dart run sing_box_flutter build --target '${{ matrix.target }}' \
            2>&1 | tee '../.build/logs/selected-${{ matrix.target }}.log'
      - name: Compile plugin and example against the built core
        if: steps.select.outputs.enabled == 'true'
        shell: bash
        env:
          LANG: en_US.UTF-8
          GRADLE_USER_HOME: ${{ github.workspace }}/.build/gradle
        run: |
          set -euo pipefail
          cd example
          if [ '${{ matrix.target }}' = 'android' ]; then
            flutter build apk --debug 2>&1 | tee ../.build/logs/plugin-android.log
          else
            flutter build ios --simulator --no-codesign 2>&1 | tee ../.build/logs/plugin-apple.log
          fi
      - name: Check native Android lifecycle
        if: steps.select.outputs.enabled == 'true' && matrix.target == 'android'
        working-directory: example/android
        run: bash gradlew :sing_box_flutter:testDebugUnitTest
      - name: Execute Android WGC runtime smoke
        if: steps.select.outputs.enabled == 'true' && matrix.target == 'android'
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          # This job runs on an ephemeral Ubuntu runner; allow its user to use KVM.
          sudo chmod a+rw /dev/kvm
          bash tool/run_android_wgc_smoke.sh 2>&1 | tee .build/logs/native-smoke-android.log
      - name: Execute Apple native runtime smoke
        if: steps.select.outputs.enabled == 'true' && matrix.target == 'apple'
        env:
          SINGBOX_HOST_PROJECT: ${{ github.workspace }}/example
        shell: bash
        run: |
          set -euo pipefail
          simulator=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$simulator" || true
          xcrun simctl bootstatus "$simulator" -b
          bash ios/Tests/run-native-smoke.sh "$simulator" \
            example/build/ios/iphonesimulator/Runner.app/PlugIns/PacketTunnel.appex/PacketTunnel \
            example/build/ios/iphonesimulator/Runner.app/Runner \
            2>&1 | tee .build/logs/native-smoke-apple.log
      - name: Record selected core artifact checksums
        if: steps.select.outputs.enabled == 'true' && matrix.target == 'android'
        run: python3 -B tool/restore_core_artifact.py --project-dir example --write-manifest
      - name: Upload release inputs and diagnostics
        if: always() && steps.select.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-core-${{ matrix.target }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: |
            .build/release/*.tar.gz
            .build/release/SHA256SUMS
            .build/cache/results/*.json
            .build/cache/generated/android/*-sources.jar
            .build/bootstrap/toolchain-provenance.json
            .build/logs/*.log
            example/.dart_tool/sing_box_flutter/native.json
            example/.dart_tool/sing_box_flutter/artifact-sha256.json
            example/.dart_tool/sing_box_flutter/builds/*/android/**
            example/.dart_tool/sing_box_flutter/builds/**/native-build.json
            example/.dart_tool/sing_box_flutter/builds/**/core-capabilities.json

  release-inputs:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'all')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-core-*
          path: .build/ci-artifacts
      - name: Assemble and verify combined release manifest
        shell: bash
        run: |
          python3 -I - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import shutil
          source = Path('.build/ci-artifacts')
          output = Path('.build/release')
          output.mkdir(parents=True, exist_ok=True)
          archives = sorted(source.rglob('libbox-*.tar.gz'))
          if len(archives) != 2 or len({p.name for p in archives}) != 2:
              raise SystemExit('Expected exactly one Android and one Apple archive')
          records = []
          for archive in archives:
              with archive.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              expected = archive.with_name('SHA256SUMS').read_text().splitlines()
              if f'{digest}  {archive.name}' not in expected:
                  raise SystemExit('Build artifact checksum differs from job manifest')
              shutil.copyfile(archive, output / archive.name)
              records.append(f'{digest}  {archive.name}\n')
          (output / 'SHA256SUMS').write_text(''.join(records))
          digest = hashlib.sha256((output / 'SHA256SUMS').read_bytes()).hexdigest()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'SHA256SUMS SHA-256: `{digest}`\n')
          PY
      - name: Validate native publication inputs without publishing
        run: python3 -I .github/scripts/publish_native_release.py --directory .build/release --dry-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-core-release
          include-hidden-files: true
          if-no-files-found: error
          path: .build/release/*

  gate:
    name: Native CI gate
    if: always() && github.event_name == 'pull_request'
    needs: [changes, validate, build, release-inputs]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful native validation when needed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          NATIVE_REQUIRED: ${{ needs.changes.outputs.native }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_RESULT: ${{ needs.release-inputs.result }}
        run: |
          python3 -I - <<'PY'
          import os
          if os.environ['CHANGES_RESULT'] != 'success':
              raise SystemExit('Native input detection did not succeed')
          results = [os.environ[name] for name in ('VALIDATE_RESULT', 'BUILD_RESULT', 'RELEASE_RESULT')]
          if os.environ['NATIVE_REQUIRED'] == 'true':
              if any(result != 'success' for result in results):
                  raise SystemExit('Native validation, both platform builds and release-input checks must pass')
              print('Native CI gate passed: all native checks succeeded')
          elif os.environ['NATIVE_REQUIRED'] == 'false':
              if any(result != 'skipped' for result in results):
                  raise SystemExit('Unexpected native job results for a non-native change')
              print('Native CI gate passed: no native build inputs changed')
          else:
              raise SystemExit('Native input detection returned no decision')
          PY
