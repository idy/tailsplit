name: Android plugin validation

on:
  workflow_dispatch:
    inputs:
      core-run-id:
        description: Completed Native core run providing the Android artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PUB_CACHE: ${{ github.workspace }}/.build/pub-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Check trusted selected core producer
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_RUN_ID: ${{ inputs.core-run-id }}
        shell: bash
        run: |
          set -euo pipefail
          # Reuse only a successful Native core run of this exact default-branch revision
          # from this repository. Any other producer controls both the selected AAR and
          # the receipt and checksums that describe it: a pull_request run can rewrite
          # native-core.yml, and a dispatch from another branch runs that branch's copy.
          # Validation dispatched from another branch also runs its own copy of this
          # workflow, so it never reuses a selected core and always builds from source.
          eligible=false
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch) || default_branch=
          if [[ "$CORE_RUN_ID" =~ ^[0-9]+$ ]] && [ -n "$default_branch" ] &&
            [ "$GITHUB_REF" = "refs/heads/$default_branch" ] &&
            producer=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CORE_RUN_ID" \
              --jq '[.status, .conclusion, .event, .path, .head_sha, .head_repository.full_name, .head_branch] | map(. // "") | join("|")'); then
            # head_branch is last: a branch name may contain the separator.
            IFS='|' read -r run_status run_conclusion run_event run_path run_sha run_repository run_branch <<< "$producer"
            if [ "$run_status" = completed ] && [ "$run_conclusion" = success ] &&
              { [ "$run_event" = workflow_dispatch ] || [ "$run_event" = push ]; } &&
              [ "$run_path" = .github/workflows/native-core.yml ] &&
              [ "$run_repository" = "$GITHUB_REPOSITORY" ] && [ "$run_sha" = "$GITHUB_SHA" ] &&
              [ "$run_branch" = "$default_branch" ]; then
              eligible=true
            fi
          fi
          if [ "$eligible" != true ]; then
            echo "The supplied run is not a successful Native core run of this default-branch revision; the selected core will be built from source."
          fi
          printf 'eligible=%s\n' "$eligible" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: native-core-android
          run-id: ${{ inputs.core-run-id }}
          github-token: ${{ github.token }}
          path: .build/ci-input/android
      - name: Prepare Flutter host SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108' 'ndk;28.2.13676358'
      - name: Verify and install the previously built core
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(find .build/ci-input/android -type f -name SHA256SUMS -print -quit)
          test -n "$manifest"
          python3 tool/install_libbox.py --target android --from-dir "$(dirname "$manifest")"
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Restore a compatible selected native core
        if: steps.producer.outputs.eligible == 'true'
        id: selected-core
        run: >-
          python3 -B tool/restore_core_artifact.py
          --from-dir .build/ci-input/android/example --project-dir example
      - name: Build the example's selected native core
        if: steps.selected-core.outputs.restored != 'true'
        working-directory: example
        run: |
          flutter pub get
          dart run sing_box_flutter build --target android
      - name: Build example APK
        working-directory: example
        run: flutter build apk --debug
      - name: Run native lifecycle and channel tests
        working-directory: example/android
        run: bash gradlew :sing_box_flutter:testDebugUnitTest
      - name: Upload native test results and debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-plugin-validation
          if-no-files-found: warn
          path: |
            example/build/app/outputs/flutter-apk/app-debug.apk
            example/build/sing_box_flutter/test-results/**
            example/build/sing_box_flutter/reports/tests/**
